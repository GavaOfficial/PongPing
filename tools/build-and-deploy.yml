name: Build and Deploy Web Version

# The web version is plain HTML5 + JavaScript: the Java sources are translated to
# JavaScript (tools/java2js) and run on a small runtime that reproduces Java2D/Swing
# in the browser (web/js/runtime). No plugin or JVM is needed to play.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments to GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build web version (Java -> JavaScript)
      run: tools/build-web.sh

    - name: Check that the committed JavaScript is up to date
      run: |
        if ! git diff --quiet -- web/js/pongping.js; then
          echo "::warning::web/js/pongping.js is out of date with the Java sources; run tools/build-web.sh and commit the result."
        fi

    - name: Check JavaScript syntax
      run: |
        for f in dist-web/js/*.js dist-web/js/runtime/*.js; do node --check "$f"; done

    - name: Upload Web Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PongPing-Web
        path: dist-web/
        if-no-files-found: error
        retention-days: 90

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download Web Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: PongPing-Web
        path: dist-web

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist-web

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
